name: FGE Intake Router

on:
  push:
    branches: ["main"]
    paths:
      - "intake/inbox/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fge-intake-router.yml"
      - "runtime/intake/**"
      - "storage_makeover/config/routing-rules.json"
      - "tests/test_fge_intake_router.py"
      - "intake/inbox/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply routing on main (false = validation only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: fge-intake-router-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate router
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run intake router tests
        run: python -m pytest -q tests/test_fge_intake_router.py
      - name: Dry-run current inbox
        run: python runtime/intake/fge_intake_router.py --repo-root . --json

  route:
    name: Route inbox drops
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fail-closed routing
        run: python runtime/intake/fge_intake_router.py --repo-root . --apply --json
      - name: Commit route receipts and candidate moves
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No routing changes to commit."
            exit 0
          fi
          git config user.name "FGE Intake Router"
          git config user.email "fge-intake-router@users.noreply.github.com"
          git add intake storage_makeover
          if git diff --cached --quiet; then
            echo "No staged routing changes."
            exit 0
          fi
          git commit -m "chore(intake): route inbox drops [skip intake]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
