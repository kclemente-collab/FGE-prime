name: Validate FGE Reference Registry

on:
  push:
    paths:
      - "00_governance/references/**"
      - ".github/workflows/validate-reference-registry.yml"
  pull_request:
    paths:
      - "00_governance/references/**"
      - ".github/workflows/validate-reference-registry.yml"
  workflow_dispatch:
    inputs:
      full_remote_audit:
        description: "Run full-registry remote audit"
        required: false
        default: "false"

jobs:
  validate-reference-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile resolver
        run: python -m py_compile 00_governance/references/validate_reference_registry.py

      - name: Validate typed registry
        run: python 00_governance/references/validate_reference_registry.py

      - name: Smoke test resolution and circuit breaker
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("00_governance/references").resolve()))
          import validate_reference_registry as fge
          registry = json.loads(Path("00_governance/references/FGE_REFERENCE_POINTER_REGISTRY_v1.json").read_text(encoding="utf-8"))
          resolver = fge.FGEReferenceResolver(registry)
          good = resolver.resolve_text("[REFERENCE: FGE-CHAR-SKELETON-PAIR-001]")
          assert good["valid"] is True and good["generation_locked"] is False
          missing = resolver.resolve_text("[REFERENCE: FGE-CHAR-HEART-NIKKI-001]")
          assert missing["generation_locked"] is True
          assert missing["faults"][0]["fault_id"] == "FGE-FAULT-REFERENCE-SOURCE-MISSING"
          bad_version = resolver.resolve_text("[REFERENCE: FGE-CHAR-SKELETON-PAIR-001@9.9.9]")
          assert bad_version["generation_locked"] is True
          PY

      - name: Identify changed resolvable pointers
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          registry = json.loads(Path("00_governance/references/FGE_REFERENCE_POINTER_REGISTRY_v1.json").read_text())
          changed_paths = set()
          try:
              event = os.environ.get("GITHUB_EVENT_NAME")
              base = os.environ.get("GITHUB_BASE_REF")
              if event == "pull_request" and base:
                  subprocess.check_call(["git", "fetch", "origin", base, "--depth", "1"])
                  diff = subprocess.check_output(["git", "diff", "--name-only", f"origin/{base}...HEAD"], text=True)
              else:
                  diff = subprocess.check_output(["git", "diff", "--name-only", "HEAD~1...HEAD"], text=True)
              changed_paths = {line.strip() for line in diff.splitlines() if line.strip()}
          except Exception:
              changed_paths = set()
          remote_ids = []
          for rec in registry["records"]:
              if rec.get("resolution_state") != "RESOLVABLE":
                  continue
              path = rec.get("path")
              if path and path in changed_paths:
                  remote_ids.append(rec["reference_id"])
          Path("/tmp/changed_pointer_ids.txt").write_text("\n".join(remote_ids))
          print("changed_resolvable_ids=" + ",".join(remote_ids))
          PY

      - name: Remote-fetch changed resolvable pointers
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "00_governance/references")
          import validate_reference_registry as fge
          ids = [line.strip() for line in Path("/tmp/changed_pointer_ids.txt").read_text().splitlines() if line.strip()]
          registry = fge.load_json(Path("00_governance/references/FGE_REFERENCE_POINTER_REGISTRY_v1.json"))
          resolver = fge.FGEReferenceResolver(registry)
          faults = []
          for rid in ids:
              token = fge.ReferenceToken(raw=f"[REFERENCE: {rid}]", reference_id=rid, version_constraint=None, anchor=None)
              resolved, fault = resolver.resolve_token(token)
              if fault:
                  faults.append(fge.asdict(fault))
                  continue
              remote_fault = fge.verify_remote_resolution(resolved, retries=3, timeout_seconds=8.0)
              if remote_fault:
                  faults.append(fge.asdict(remote_fault))
          print(json.dumps({"changed_ids": ids, "faults": faults}, indent=2))
          if faults:
              raise SystemExit(1)
          PY

      - name: Optional full-registry remote audit
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_remote_audit == 'true'
        run: python 00_governance/references/validate_reference_registry.py --check-remote
