name: Modular Fashion OS

on:
  pull_request:
    branches: ["main"]
    paths:
      - "systems/__init__.py"
      - "systems/modular_fashion_os/**"
      - ".github/workflows/modular-fashion-os.yml"
  push:
    branches:
      - "fge/modular-fashion-os-v0.1"
    paths:
      - "systems/__init__.py"
      - "systems/modular_fashion_os/**"
      - ".github/workflows/modular-fashion-os.yml"

permissions:
  contents: read

jobs:
  validate-fashion-os:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fge
          POSTGRES_PASSWORD: fge
          POSTGRES_DB: fge_fashion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fge -d fge_fashion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: .
      FGE_TEST_DATABASE_URL: postgresql://fge:fge@localhost:5432/fge_fashion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install validation tools
        run: >-
          python -m pip install --upgrade pytest flake8
          -r systems/modular_fashion_os/requirements.txt
      - name: Syntax and undefined-name check
        run: flake8 systems/modular_fashion_os --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Fashion OS tests
        run: python -m pytest -q systems/modular_fashion_os/tests
