name: FGE Intel Card Mirror PR4 Close Proof

on:
  pull_request:
    paths:
      - "runtime/intel_card_mirror/**"
      - "cards/FGE-CARD-RAVEN-001_v0.1.1.json"
      - "book_raven.py"
      - "registry.py"
      - ".github/workflows/fge-intel-card-mirror-t01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute PR4 close proof
        run: |
          python runtime/intel_card_mirror/proof_close.py \
            --repo-root . \
            --card cards/FGE-CARD-RAVEN-001_v0.1.1.json \
            --evidence-dir .fge_evidence/PR4_CLOSE

      - name: Publish close-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fge-intel-card-raven-pr4-close-${{ github.run_id }}
          path: .fge_evidence/PR4_CLOSE
          if-no-files-found: error
