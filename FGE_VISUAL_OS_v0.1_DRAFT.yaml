# ============================================================
# ARCHETYPE DEFINITIONS (Core Types)
# ============================================================
archetype_definitions:

  Character_Genome_Sheet:
    description: "Primary technical reference for canon characters. Dense, data-heavy, focused on biometric lock and production consistency."
    required_zones:
      - ZONE_01_HEADER
      - ZONE_02_HERO
      - ZONE_03_PRIMARY_DATA_PANELS
      - ZONE_09_FOOTER
      - ZONE_10_BORDER_FRAME
    optional_zones:
      - ZONE_04_SECONDARY_PANELS
      - ZONE_07_QUOTE_OR_LORE
      - ZONE_12_TECHNICAL_METADATA
    forbidden_elements:
      - "Deviation from 32cm gospel measurements"
      - "Missing Face Lock or Body Lock prompt blocks"
      - "Unverified biometric data presented as canonical"
    recommended_visual_language:
      frame: "dark_luxury or prism_glass"
      density: "maximal"
      typography: "data_mono + luxury_serif headers"

  Ecosystem_Master_Schema_Map:
    description: "High-level living map of the entire FGE universe showing how systems, characters, and value streams interconnect."
    required_zones:
      - ZONE_01_HEADER
      - ZONE_03_PRIMARY_DATA_PANELS
      - ZONE_05_NETWORK_DIAGRAM
      - ZONE_06_FLOW_OR_TIMELINE
      - ZONE_09_FOOTER
      - ZONE_10_BORDER_FRAME
    optional_zones:
      - ZONE_07_QUOTE_OR_LORE
      - ZONE_11_ORNAMENTS
    forbidden_elements:
      - "Missing governance or Seed Philosophy language"
      - "Unclear system interconnections"
    recommended_visual_language:
      frame: "dark_luxury"
      density: "high"
      particles: "gold_embers"

  Meta_System_Flowchart:
    description: "Defines production infrastructure and governance (e.g. N+3 Visual OS)."
    required_zones:
      - ZONE_01_HEADER
      - ZONE_03_PRIMARY_DATA_PANELS
      - ZONE_06_FLOW_OR_TIMELINE
      - ZONE_09_FOOTER
      - ZONE_10_BORDER_FRAME
    optional_zones:
      - ZONE_05_NETWORK_DIAGRAM
      - ZONE_11_ORNAMENTS
    forbidden_elements:
      - "Missing governance layer"
      - "Unclear stage progression or status system"
    recommended_visual_language:
      frame: "dark_luxury"
      density: "high"

  Technical_Pipeline_Diagram:
    description: "Step-by-step technical process (e.g. Face Prompt Engine, Reversal Engine)."
    required_zones:
      - ZONE_01_HEADER
      - ZONE_03_PRIMARY_DATA_PANELS
      - ZONE_06_FLOW_OR_TIMELINE
      - ZONE_09_FOOTER
    optional_zones:
      - ZONE_04_SECONDARY_PANELS
      - ZONE_12_TECHNICAL_METADATA
    forbidden_elements:
      - "Missing clear input → output data flow"
    recommended_visual_language:
      frame: "dark_luxury"
      typography: "data_mono"
      density: "high"

  Artifact_Poster:
    description: "Narrative + visual delivery vehicle for a single relic, character, or concept. More artistic than technical."
    required_zones:
      - ZONE_01_HEADER
      - ZONE_02_HERO
      - ZONE_03_PRIMARY_DATA_PANELS
      - ZONE_07_QUOTE_OR_LORE
      - ZONE_09_FOOTER
      - ZONE_10_BORDER_FRAME
    optional_zones:
      - ZONE_08_SYMBOL_OR_ICON_ROW
      - ZONE_11_ORNAMENTS
    forbidden_elements:
      - "Overly dense technical data that overwhelms the artistic intent"
    recommended_visual_language:
      frame: "ornate_gold or dark_luxury"
      density: "balanced"
      lighting: "cinematic_tenebrism or gold_ember_glow"

