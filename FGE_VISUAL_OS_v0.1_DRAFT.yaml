# FGE_VISUAL_OS_v0.1_DRAFT.yaml
# Feral Gloss Empire Visual Operating System
# Status: DRAFT PROPOSAL — Awaiting Director Review
# Scope: Infographics only (Character Tiers 1–4 schema remains separate)
# Purpose: Establish a consistent, machine-readable visual schema layer to eliminate drift,
#          enable reconstruction, and turn infographic production into a governed system.

version: "0.1"
status: "DRAFT - For Keith Review"
date: "2026-06-18"
proposed_by: "Grok (Systems Architecture)"
doctrine_reference: "Publishing Studio Constitution - Quality exceeds quantity. Every asset must connect to Character | Companion | Location | Event | Relationship | Collection."

# ============================================================
# EXECUTIVE SUMMARY
# ============================================================
executive_summary: |
  This proposal introduces a Visual Operating System for FGE infographics only.
  Current infographics are high-quality but structurally inconsistent. Each generation
  drifts because the model has no persistent understanding of which elements are
  structural, data-bearing, identity-defining, or purely decorative.
  
  This draft proposes:
  1. A grounded 12-zone vocabulary derived from actual uploaded infographics.
  2. Archetype classification for the existing body of work.
  3. Required / Optional / Forbidden element rules per archetype.
  
  Goal: Give Keith a concrete, reviewable artifact that can be ratified, modified,
  or rejected before any canon-bearing infrastructure is created.

# ============================================================
# ZONE VOCABULARY v0.1 (Empirically Grounded)
# ============================================================
# Derived from analysis of uploaded assets: Raven Genome Sheets, Master Atlas,
# N+3 Visual OS, Face Prompt Engine, Artifact Posters, and Technical Dossiers.

zone_vocabulary:
  ZONE_01_HEADER:
    description: "Top-level identification block containing title, artifact ID, version, and classification."
    typical_content: ["Main title", "Subtitle", "Artifact ID / Version", "Status badge"]
    weight: "information_high"
    required: true

  ZONE_02_HERO:
    description: "Dominant visual subject — usually the character or central figure, often shown in multiple views (front/back, clothed/unclothed)."
    typical_content: ["Full-body render", "Dual-view (front + back)", "Hero portrait"]
    weight: "character_high"
    required: false

  ZONE_03_PRIMARY_DATA_PANELS:
    description: "Core information containers. Highest density of structured data. Includes tables, stat blocks, attribute grids, and red/glowing data orbs."
    typical_content: ["Biometric tables", "Attribute grids", "Red data orbs", "Measurement blocks"]
    weight: "information_high"
    required: true

  ZONE_04_SECONDARY_PANELS:
    description: "Supporting analytical or reference modules (Skin Analysis, Hair Module, Hand Map, Expression Library, Lighting Reference, etc.)."
    typical_content: ["Analysis modules", "Thumbnail grids", "Small diagrams"]
    weight: "information_medium"
    required: false

  ZONE_05_NETWORK_DIAGRAM:
    description: "Relationship, system, or knowledge graph visualizations showing connections between entities."
    typical_content: ["Knowledge Graph", "Relationship Web", "Flow diagrams", "Node maps"]
    weight: "information_medium"
    required: false

  ZONE_06_FLOW_OR_TIMELINE:
    description: "Sequential or evolutionary progression (stages, timelines, production rivers, evolution trees)."
    typical_content: ["Vertical flow stages", "Timeline", "Evolution tree", "Production river"]
    weight: "information_medium"
    required: false

  ZONE_07_QUOTE_OR_LORE:
    description: "Thematic quote, doctrinal statement, or narrative fragment that anchors meaning."
    typical_content: ["Quote block", "Lore fragment", "Doctrine statement"]
    weight: "narrative_medium"
    required: false

  ZONE_08_SYMBOL_OR_ICON_ROW:
    description: "Strip of icons, sigils, material fingerprints, or classification badges."
    typical_content: ["Icon row", "Sigil strip", "Classification badges"]
    weight: "ornament_low"
    required: false

  ZONE_09_FOOTER:
    description: "Bottom metadata block containing version history, archive stamps, governance notes, and production metadata."
    typical_content: ["Version stamp", "Archive ID", "Canonical confidence %", "Director notes"]
    weight: "information_low"
    required: true

  ZONE_10_BORDER_FRAME:
    description: "Outer architectural frame that defines the overall visual container (ornate gold, obsidian, prism glass, etc.)."
    typical_content: ["Decorative frame", "Corner ornaments", "Edge treatment"]
    weight: "decorative_high"
    required: true

  ZONE_11_ORNAMENTS:
    description: "Non-structural decorative elements (particles, embers, flourishes, light leaks, Kintsugi effects)."
    typical_content: ["Gold embers", "Light particles", "Corner flourishes"]
    weight: "decorative_medium"
    required: false

  ZONE_12_TECHNICAL_METADATA:
    description: "Generation-specific technical blocks (prompt locks, seed values, model info, face/body lock prompts, pipeline metadata)."
    typical_content: ["Face Lock Prompt", "Body Lock Prompt", "Generation metadata", "Pipeline info"]
    weight: "information_medium"
    required: false

